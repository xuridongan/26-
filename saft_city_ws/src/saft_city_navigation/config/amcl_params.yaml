# AMCL (Adaptive Monte Carlo Localization) - Official Husky params
# General
use_map_topic:            true
first_map_only:           false
scan_topic:               /front/scan
base_frame_id:            base_link
global_frame_id:          map
odom_frame_id:            odom

# Laser model
laser_model_type:         likelihood_field
laser_min_range:          0.1
laser_max_range:          30.0
laser_max_beams:          60
laser_likelihood_max_dist: 2.0
z_hit:                    0.5
z_short:                  0.05
z_max:                    0.05
z_rand:                   0.5
sigma_hit:                0.2
lambda_short:             0.1
lambda_rand:              0.1

# Motion model
odom_model_type:          diff
odom_alpha1:              0.2
odom_alpha2:              0.2
odom_alpha3:              0.2
odom_alpha4:              0.2
odom_alpha5:              0.1

# Particle filter
min_particles:            500
max_particles:            2000
kld_err:                  0.05
kld_z:                    0.99
resample_interval:        1
recovery_alpha_slow:      0.0
recovery_alpha_fast:      0.0
update_min_d:             0.25
update_min_a:             0.2

# Initial pose (匹配机器人生成位置 0.7, -7)
initial_pose_x:           0.7
initial_pose_y:           -7.0
initial_pose_a:           0.0
initial_cov_xx:           0.8
initial_cov_yy:           0.8
initial_cov_aa:           0.8

# Transform
tf_broadcast:             true
transform_tolerance:      1.0

# Resampling
selective_resampling:     false
gui_publish_rate:         10.0
save_pose_rate:           0.5
