default_tolerance:            0.5
visualize_potential:          true
use_dijkstra:                 true
use_grid_path:                false
use_quadratic:                true
use_dumb:                     false
old_navfn_behavior:           false
neutral_cost:                 80
cost_factor:                  5.0
lethal_cost:                  253
publish_potential:            false
planner_window_x:             0.0
planner_window_y:             0.0
orientation_mode:             0
orientation_window_size:      1
