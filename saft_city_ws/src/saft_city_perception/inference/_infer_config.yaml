BBoxPostProcess: {decode: PPYOLOEDecode, nms: MultiClassNMS}
CSPResNet:
  act: swish
  depth_mult: 0.33
  return_idx: [1, 2, 3]
  use_large_stem: true
  width_mult: 0.5
CustomCSPPAN: {act: swish, depth_mult: 0.33, width_mult: 0.5}
EvalReader:
  batch_size: 1
  sample_transforms:
  - Decode: {}
  - Resize:
      interp: 2
      keep_ratio: false
      target_size: [640, 640]
  - NormalizeImage:
      is_scale: true
      mean: [0.485, 0.456, 0.406]
      norm_type: mean_std
      std: [0.229, 0.224, 0.225]
  - Permute: {}
MultiClassNMS: {keep_top_k: 100, nms_threshold: 0.5, nms_top_k: 1000, score_threshold: 0.01}
PPYOLOEDecode: {reg_max: 16}
PPYOLOEHead:
  act: swish
  fpn_strides: [32, 16, 8]
  grid_cell_offset: 0.5
  grid_cell_scale: 5.0
  nms: MultiClassNMS
  num_classes: 10
  reg_max: 16
  static_assigner_epoch: 4
architecture: PPYOLOE
backbone: CSPResNet
metric: COCO
neck: CustomCSPPAN
num_classes: 10
post_process: BBoxPostProcess
use_gpu: false
weights: /home/xuan/saft_city_ws/src/saft_city_perception/scripts/../inference/model_final.pdparams
worker_num: 1
yolo_head: PPYOLOEHead
